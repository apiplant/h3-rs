[package]
name = "h3-rs"
version = "0.4.0"
edition = "2021"
# ntex 4 (the `serve` feature) needs 1.97
rust-version = "1.97"
description = "MiniMax H3 text/image-to-video with stereo audio in Rust (CUDA or Apple Silicon MLX)"
license = "Apache-2.0"
repository = "https://github.com/apiplant/h3-rs"
homepage = "https://h3-rs.apiplant.com"
readme = "README.md"
keywords = ["video-generation", "diffusion", "cuda", "minimax", "candle"]
categories = ["multimedia::video", "science", "command-line-utilities"]
# the crate is the engine and the binary; model weights are never part of it
include = ["/src/", "/assets/tokenizer.json", "/configs/", "/ui/dist/", "/build.rs", "/README.md", "/LICENSE"]

[lib]
name = "h3_rs"

[[bin]]
name = "h3"
path = "src/main.rs"
required-features = ["serve"]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-flash-attn = { version = "0.11.0", optional = true }
cudarc = { version = "0.19.8", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "cublaslt", "f16", "cuda-version-from-build-system", "dynamic-linking"], optional = true }
clap = { version = "4", features = ["derive", "env"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hound = "3.5"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
toml = "0.8"
ntex = { version = "4", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

[features]
default = ["cuda", "flash-attn", "serve"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:cudarc"]
# Native Apple Silicon: MLX quantized GEMMs/attention and Candle Metal tensor ops.
mlx = ["dep:mlx-rs", "candle-core/metal", "candle-nn/metal"]
# `h3 serve` / `h3_rs::serve` (ntex HTTP server)
serve = ["dep:ntex", "dep:tokio"]
flash-attn = ["cuda", "dep:candle-flash-attn"]

[profile.release]
opt-level = 3
debug = false
codegen-units = 16

# release archives and packages: no debug info
[profile.dist]
inherits = "release"
strip = true

[profile.dev]
opt-level = 1

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "=0.32.0", optional = true }

[[example]]
name = "lt_probe"
required-features = ["cuda"]

[[example]]
name = "attn_bench"
required-features = ["cuda"]

[[example]]
name = "gemm_bench"
required-features = ["cuda"]
